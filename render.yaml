services:
  - type: web
    name: lakshya-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_GMAIL_USER
        sync: false
      - key: SMTP_GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_ALLOW_SELF_SIGNED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: YOUTUBE_API_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: PLANNER_AI_URL
        sync: false
      - key: PLANNER_AI_TOKEN
        sync: false
      - key: PROCTOR_AI_URL
        sync: false
      - key: PROCTOR_AI_TOKEN
        sync: false
  - type: web
    name: lakshya-planner-ai
    runtime: python
    rootDir: planner-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: PLANNER_AI_TOKEN
        sync: false
  - type: web
    name: lakshya-proctor-ai
    runtime: python
    plan: free
    region: singapore
    rootDir: proctor-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PROCTOR_AI_TOKEN
        sync: false
