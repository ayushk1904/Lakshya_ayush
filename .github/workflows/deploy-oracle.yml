# Updates the Oracle Cloud server on every push to main, like Render's auto-deploy.
# Needs repository secrets ORACLE_HOST (the server's public IP) and ORACLE_SSH_KEY (the private
# key downloaded when the VM was created). Until they are set, the job just says so and passes.
name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
    paths-ignore:
      - "client/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update the server
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "::notice::ORACLE_HOST / ORACLE_SSH_KEY are not set yet; skipping deploy."
            exit 0
          fi
          install -m 600 /dev/null key
          printf '%s\n' "$ORACLE_SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "ubuntu@$ORACLE_HOST" \
            "sudo /usr/bin/bash /opt/lakshya/deploy/oracle/update.sh"
